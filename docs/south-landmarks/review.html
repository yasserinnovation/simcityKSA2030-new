<header><h1>The south, with local character</h1><p>Rijal Almaa stone towers, Shada Palace, Al-Aan Palace, Dosariyah Castle and Aseer neighbourhoods. Jeddah gains Al-Jawhara's open bowl and faceted roof, plus Nassif House and Beit Al-Matbouli in Al-Balad.</p><select id="view" aria-label="Choose a landmark"><option value="al-jawhara-close">Al-Jawhara — close-up</option><option value="al-jawhara">Northern Jeddah — before / after</option><option value="south">Southern region</option><option value="abha">Abha · Shada Palace</option><option value="rijal-almaa">Rijal Almaa</option><option value="najran">Najran · Al-Aan Palace</option><option value="jazan">Jazan · Dosariyah Castle</option><option value="jeddah-heritage">Al-Balad heritage houses</option></select><p><a href="../../index.html?style=south-landmarks">Play — select South or West</a> · <a href="NOTES.md">Locations and checks</a></p></header>
<main id="gallery"><figure id="old"><figcaption>Before this pass</figcaption><img id="before" alt="Previous landmark view"></figure><figure><figcaption id="caption">Current view</figcaption><img id="after" alt="Updated landmark view"></figure></main>
<script>const view=document.querySelector('#view');function show(){const close=view.value==='al-jawhara-close';document.querySelector('#gallery').classList.toggle('close',close);document.querySelector('#after').src='after/'+view.value+'.png';if(!close)document.querySelector('#before').src='before/'+view.value+'.png';}view.addEventListener('change',show);show();</script></html>
